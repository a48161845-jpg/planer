<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b12" id="themeColor">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Планер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Дизайн-система «Планер» ============ */
:root,[data-theme=dark]{
  --r:20px;--r2:14px;--ease:cubic-bezier(.2,.8,.2,1);
  --line:rgba(170,180,210,.12);--text:#eef0fa;--muted:#9097b3;--faint:#5f6684;--accent-ink:#fff;
  --ok:#4fd18f;--warn:#f0b95a;--bad:#ff7b8a;--nav:rgba(18,20,40,.82);--shadow:0 14px 34px rgba(0,0,0,.38)
}
[data-theme=light]{
  --line:rgba(30,41,80,.09);--text:#161b33;--muted:#5f6784;--faint:#9aa2bd;--accent-ink:#fff;
  --ok:#1f9a62;--warn:#b57a14;--bad:#d2445a;--nav:rgba(255,255,255,.88);--shadow:0 10px 28px rgba(30,41,90,.12)
}
[data-theme=dark][data-scheme=aurora]{--bg:#0b0d1a;--surface:#141731;--surface2:#1e2246;--accent:#9a8cff;--g1:#6a5cff;--g2:#22c1e8}
[data-theme=light][data-scheme=aurora]{--bg:color-mix(in srgb,#5a4bf0 5%,#f4f5fa);--surface:#fff;--surface2:color-mix(in srgb,#5a4bf0 7%,#f1f3f9);--accent:#5a4bf0;--g1:#6a5cff;--g2:#22c1e8}
[data-theme=dark][data-scheme=ocean]{--bg:#07131a;--surface:#0e202b;--surface2:#162d3b;--accent:#43cbe6;--g1:#1f7ae0;--g2:#2fd4b8}
[data-theme=light][data-scheme=ocean]{--bg:color-mix(in srgb,#0f7fb8 5%,#f4f5fa);--surface:#fff;--surface2:color-mix(in srgb,#0f7fb8 7%,#f1f3f9);--accent:#0f7fb8;--g1:#1f7ae0;--g2:#2fd4b8}
[data-theme=dark][data-scheme=ember]{--bg:#150e0d;--surface:#211615;--surface2:#2c1e1c;--accent:#ff9a6b;--g1:#ff6a5a;--g2:#ffb347}
[data-theme=light][data-scheme=ember]{--bg:color-mix(in srgb,#d9572b 5%,#f4f5fa);--surface:#fff;--surface2:color-mix(in srgb,#d9572b 7%,#f1f3f9);--accent:#d9572b;--g1:#ff6a5a;--g2:#ffb347}
[data-theme=dark][data-scheme=forest]{--bg:#0a1410;--surface:#12201a;--surface2:#1a2d25;--accent:#55d99a;--g1:#1f9e6e;--g2:#9ad14f}
[data-theme=light][data-scheme=forest]{--bg:color-mix(in srgb,#1f8f5f 5%,#f4f5fa);--surface:#fff;--surface2:color-mix(in srgb,#1f8f5f 7%,#f1f3f9);--accent:#1f8f5f;--g1:#1f9e6e;--g2:#9ad14f}
[data-theme=dark][data-scheme=plum]{--bg:#130d1a;--surface:#1d1428;--surface2:#291c38;--accent:#d68bff;--g1:#a24bff;--g2:#ff6bb3}
[data-theme=light][data-scheme=plum]{--bg:color-mix(in srgb,#9a3fd6 5%,#f4f5fa);--surface:#fff;--surface2:color-mix(in srgb,#9a3fd6 7%,#f1f3f9);--accent:#9a3fd6;--g1:#a24bff;--g2:#ff6bb3}
[data-theme=dark][data-scheme=graphite]{--bg:#101214;--surface:#191c1f;--surface2:#23272b;--accent:#a9b8cb;--g1:#5d7390;--g2:#8aa0ba}
[data-theme=light][data-scheme=graphite]{--bg:color-mix(in srgb,#4f6680 5%,#f4f5fa);--surface:#fff;--surface2:color-mix(in srgb,#4f6680 7%,#f1f3f9);--accent:#4f6680;--g1:#5d7390;--g2:#8aa0ba}
:root{--accent-soft:color-mix(in srgb,var(--accent) 17%,transparent);--glow:color-mix(in srgb,var(--accent) 35%,transparent);--grad:linear-gradient(135deg,var(--g1),var(--g2))}
:root,[data-theme]{--hero:var(--grad);--panel:var(--surface);--panel2:var(--surface2);--onacc:var(--accent-ink);--accent2:var(--accent)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);
  font:15px/1.45 "Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body{background:radial-gradient(700px 380px at 90% -120px,color-mix(in srgb,var(--g1) 30%,transparent),transparent 70%),radial-gradient(600px 360px at -10% 8%,color-mix(in srgb,var(--g2) 16%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
button{font-family:inherit}
.ic{flex:none;display:block}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}

/* шапка */
header{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
header h1{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.025em}
header .sub{font-size:13px;color:var(--muted);margin-top:2px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--text);cursor:pointer;flex:none;transition:transform .15s var(--ease),background .15s}
.ibtn:active{transform:scale(.92)}
.ibtn.sm{width:34px;height:34px}
.ibtn.acc{background:var(--grad);color:var(--accent-ink)}
.ibtn.soft{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--muted);font-size:12px;padding:6px 11px;border-radius:20px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(82,183,136,.18)}

main{flex:1;overflow:auto;padding:10px 16px 120px;scroll-behavior:smooth}
main.anim>*{animation:rise .32s var(--ease) both}
main.anim>*:nth-child(2){animation-delay:.03s}main.anim>*:nth-child(3){animation-delay:.06s}main.anim>*:nth-child(4){animation-delay:.09s}
main.anim>*:nth-child(5){animation-delay:.12s}main>*:nth-child(6){animation-delay:.15s}main>*:nth-child(n+7){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* навигация */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:736px;margin:0 auto;display:flex;padding:6px;
  background:var(--nav);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);padding:3px 0 4px;font-size:10.5px;font-weight:500;cursor:pointer;letter-spacing:.01em}
nav .nv{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;transition:background .25s var(--ease),color .25s,transform .2s var(--ease)}
nav button:active .nv{transform:scale(.92)}
nav button.active{color:var(--accent)}
nav button.active .nv{background:var(--accent-soft)}

/* карточки и сгруппированные списки */
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.li{position:relative;background:var(--surface);margin:0;padding:13px 16px;border-radius:0;display:flex;align-items:center;gap:13px}
.li.col{display:block}
.li:not(.li + .li){border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
.li:not(:has(+ .li)){border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);margin-bottom:12px}
.li + .li::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.li.clk{cursor:pointer;transition:background .15s}.li.clk:active{background:var(--surface2)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.title{font-weight:600;font-size:15.5px;line-height:1.3;word-break:break-word}
.meta{color:var(--muted);font-size:12.5px;line-height:1.5}
.meta .ic{vertical-align:-2px;margin-right:3px}
.meta .ic{display:inline-block;vertical-align:-3px;margin:0 2px}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.badge{font-size:12px;color:var(--muted);background:none;padding:0}
.badge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.badge.hi{color:var(--bad)}.badge.mid{color:var(--warn)}.badge.lo{color:var(--ok)}
.tint{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;flex:none;color:var(--c);background:var(--surface2);background:color-mix(in srgb,var(--c) 17%,transparent)}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:24px 4px 9px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.015em}
h2:first-child{margin-top:6px}
h2 a{color:var(--accent);font-weight:500;cursor:pointer;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:26px 14px;font-size:14px;background:var(--surface);border-radius:var(--r);margin-bottom:12px}
.empty::before{content:"";display:block;width:34px;height:4px;border-radius:4px;background:var(--surface2);margin:0 auto 12px}

/* формы */
input,select,textarea{width:100%;background:var(--surface2);color:var(--text);border:0;border-radius:var(--r2);padding:12px 14px;font:inherit;margin-bottom:10px;outline:0;transition:box-shadow .15s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px var(--accent)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[type=color]{padding:3px;height:44px}
input[type=file]{padding:9px 12px;font-size:13px}
label{display:block;font-size:12.5px;color:var(--muted);margin:2px 4px 6px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);box-shadow:0 6px 18px -6px var(--glow);color:var(--accent-ink);border:0;border-radius:var(--r2);padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.97);opacity:.9}
.btn.sec{background:var(--surface2);color:var(--text)}
.btn.bad{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;font-weight:500;border-radius:11px}
.btn.full{width:100%}
.card .btn.full,.card .grid2 .btn{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.chk{width:25px;height:25px;border-radius:50%;border:2px solid var(--faint);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.chk:active{transform:scale(.9)}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk.done::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-t{text-decoration:line-through;color:var(--muted)}

/* переключатели */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--surface);border:0;color:var(--muted);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;user-select:none;transition:all .2s var(--ease)}
.chip.active{background:var(--accent-soft);color:var(--accent)}
.chips.seg{display:flex;flex-wrap:nowrap;gap:2px;background:var(--surface);padding:3px;border-radius:14px}
.seg .chip{flex:1;text-align:center;background:transparent;border-radius:11px;padding:8px 6px;white-space:nowrap}
.seg .chip.active{background:var(--surface2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
[data-theme=light] .seg .chip.active{background:#fff;box-shadow:0 1px 4px rgba(30,41,59,.14)}
[data-theme=light] .seg{background:var(--surface2)}

/* показатели */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:var(--r);padding:13px 8px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .5s var(--ease)}
.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}
.hidden{display:none!important}

/* главная */
.hero{display:flex;align-items:center;gap:16px;background:var(--grad);color:#fff;padding:20px;position:relative;overflow:hidden;box-shadow:0 18px 40px -16px var(--glow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.hero::before{width:190px;height:190px;right:-60px;top:-80px}.hero::after{width:120px;height:120px;left:40%;bottom:-70px;background:rgba(255,255,255,.09)}
.hero>*{position:relative;z-index:1}
.hero .meta{color:rgba(255,255,255,.82)}
.hero .big-n{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.ring{--p:0;width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 28px var(--accent-soft)}
.ring i{width:68px;height:68px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:18px;letter-spacing:-.02em}
.hero-stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hero-stats span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#fff;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:20px}
.hero-stats .ic{color:#fff}
.qa{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:20px;padding:5px 5px 5px 16px;margin-bottom:6px}
.qa input{margin:0;background:none;padding:9px 0;box-shadow:none!important}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .day{flex:none;width:56px;text-align:center;background:var(--surface);border-radius:18px;padding:10px 4px 9px;cursor:pointer;transition:transform .15s var(--ease)}
.strip .day:active{transform:scale(.95)}
.strip .day span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.strip .day b{display:block;font-size:19px;font-weight:700;margin:3px 0 5px;letter-spacing:-.02em}
.strip .day em{display:flex;justify-content:center;gap:3px;height:6px;font-style:normal}
.strip .day em i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.strip .day.today{background:var(--accent);color:var(--accent-ink)}
.strip .day.today span{color:inherit;opacity:.8}
.strip .day.today em i{background:var(--accent-ink)}

/* календарь */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
.mhead b{font-size:18px;letter-spacing:-.02em}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px;background:var(--surface);border-radius:var(--r);padding:10px 8px 8px}
.mgrid .wd{text-align:center;font-size:11px;color:var(--faint);padding:2px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.mgrid button{background:none;border:0;border-radius:14px;color:var(--text);padding:7px 0 5px;min-height:46px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .15s}
.mgrid button.out{color:var(--faint);opacity:.55}
.mgrid button.hol{color:var(--bad)}
.mgrid button.today{color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.mgrid button.sel{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px var(--glow);font-weight:700}
.dots{display:flex;justify-content:center;gap:3px;height:5px;margin-top:4px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.mgrid button.sel .dots i{background:var(--accent-ink)!important;opacity:.85}
.tl{align-items:flex-start}
.tl::after{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3.5px;border-radius:0 4px 4px 0;background:var(--c,var(--accent))}
.tl .tm{width:54px;flex:none;line-height:1.25}
.tl .tm b{display:block;font-size:14.5px}
.tl .tm span{font-size:12px;color:var(--muted)}
.tl .tm.all{font-size:12px;color:var(--muted);padding-top:2px}
.kind{color:var(--muted);margin-right:6px;display:inline-flex;vertical-align:middle}
.kind .ic{display:block}

/* привычки */
.hab{display:block}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wk button{background:var(--surface2);border:0;color:var(--muted);border-radius:50%;aspect-ratio:1;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);max-width:40px;width:100%;margin:0 auto}
.wk button:active{transform:scale(.88)}
.wk button.on{background:var(--ok);color:#fff}
.wk button.today{box-shadow:0 0 0 2px var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:var(--muted)}
.heat i.on{background:var(--ok);color:#fff}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--warn);font-weight:700;font-size:13px}

/* прочее */
.big{font-size:46px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0 12px;letter-spacing:-.02em}
.cols{display:flex;align-items:flex-end;gap:7px;height:96px;margin:10px 0 4px}
.cols div{flex:1;background:var(--accent);border-radius:7px 7px 3px 3px;min-height:3px;opacity:.9}
.cols.lbl{height:auto;margin:0}.cols.lbl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.thumb{max-width:100%;max-height:230px;border-radius:14px;margin-top:10px;display:block}
.pre{white-space:pre-wrap;word-break:break-word}
.navrow{gap:14px;cursor:pointer}
.navrow .chev{color:var(--faint)}
.navrow .cnt{font-size:13px;color:var(--muted);margin-right:2px}
.navrow:active{background:var(--surface2)}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--surface2);color:var(--text);box-shadow:var(--shadow);padding:11px 18px;border-radius:16px;font-size:13.5px;z-index:40;opacity:0;transition:all .25s var(--ease);pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(96px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--grad);color:var(--accent-ink);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px var(--glow),0 2px 6px rgba(0,0,0,.25);cursor:pointer;z-index:6;transition:transform .2s var(--ease)}
.fab:active{transform:scale(.9)}

/* шторка */
#sheet .bd{position:fixed;inset:0;background:rgba(5,8,12,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;animation:fade .2s both}
#sheet .box{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;z-index:21;max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:slide .32s var(--ease) both;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
#sheet .box::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--faint);opacity:.5;margin:9px auto 0}
#sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 8px}
#sheet .sh b{font-size:19px;letter-spacing:-.02em}
#sheet .sb{overflow:auto;padding:6px 20px 20px}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* блокировка */
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:320px;text-align:center}
#lock input{text-align:center;font-size:24px;letter-spacing:8px}

/* ===== доработка оформления ===== */
body.sub header h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.sub header .grow{min-width:0}
body.sub .pill{display:none}
header .grow{min-width:0}
.card .chip{background:var(--surface2)}
.card .chip.active{background:var(--accent-soft)}
.card .chips{gap:8px}
/* переключатель вместо флажка */
label:has(>input[type=checkbox]){display:flex;align-items:center;gap:12px;margin:10px 2px;font-size:14.5px;color:var(--text);cursor:pointer;font-weight:500}
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:46px;height:28px;border-radius:14px;background:var(--surface2);position:relative;margin:0;vertical-align:middle;transition:background .22s var(--ease);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;order:2;margin-left:auto}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .22s var(--ease)}
input[type=checkbox]:checked{background:var(--accent)}
input[type=checkbox]:checked::after{transform:translateX(18px)}
.card .btn.full+.btn.full,.card .btn+.btn{margin-top:8px}
.ibtn.sm svg{display:block}
.card .row>.ibtn+.ibtn{margin-left:2px}

/* ===== v4: яркий стиль ===== */
.hero .ring{background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);box-shadow:none}
.hero .ring i{background:color-mix(in srgb,var(--g1) 80%,#000);color:#fff}
.fab{box-shadow:0 12px 28px -6px var(--glow)}
h2{letter-spacing:-.01em}
nav button{font-size:10px}
nav .nv{width:44px}
.btn.big{padding:15px 18px;font-size:16px;border-radius:16px}
.btn.sec{background:var(--surface2);box-shadow:none}
.btn.bad{box-shadow:inset 0 0 0 1px var(--line)}
/* быстрые действия */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;border:0;border-radius:var(--r);background:var(--surface);color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer;transition:transform .15s var(--ease)}
.act:active{transform:scale(.95)}
.act .tint{width:42px;height:42px}
/* плитки показателей */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:var(--c,var(--accent));opacity:.13}
.kpi .tint{width:34px;height:34px;margin-bottom:10px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--c,var(--accent))}
/* столбчатая диаграмма недели */
.chart{display:flex;align-items:flex-end;gap:9px;height:112px;margin-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .col i{display:block;width:100%;min-height:5px;border-radius:9px 9px 5px 5px;background:var(--surface2);transition:height .5s var(--ease)}
.chart .col.on i{background:var(--grad);box-shadow:0 6px 14px -6px var(--glow)}
.chart .col span{font-size:11px;color:var(--faint);font-weight:600}
.chart .col.today span{color:var(--accent)}
.chart .col b{font-size:11px;font-weight:700;color:var(--muted)}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.tip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip span{font-size:13px;color:var(--muted)}
.water-w{display:flex;align-items:center;gap:14px}
.water-w .bar{margin-top:10px;height:9px}
/* окно входа */
#auth{position:fixed;inset:0;z-index:30;overflow:auto;background:radial-gradient(700px 420px at 80% -100px,color-mix(in srgb,var(--g1) 45%,transparent),transparent 70%),radial-gradient(600px 400px at 0% 100%,color-mix(in srgb,var(--g2) 30%,transparent),transparent 70%),var(--bg);display:flex;padding:calc(24px + env(safe-area-inset-top)) 22px 24px}
#auth.hidden{display:none}
.auth-box{margin:auto;width:100%;max-width:380px;text-align:center}
.auth-logo{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -10px var(--glow)}
.auth-box h1{font-size:34px;margin:0 0 8px;letter-spacing:-.03em;font-weight:800}
.auth-box p{color:var(--muted);margin:0 0 26px;font-size:14.5px}
.auth-box label{text-align:left}
.auth-box .btn{margin-top:10px}
.auth-or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:16px 0 4px}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-skip{display:block;margin:16px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;padding:6px}
.auth-hint{margin-top:18px;font-size:12.5px;color:var(--faint);line-height:1.5}
.auth-err{color:var(--bad);font-size:13px;margin:8px 0 0;text-align:left}
input.code{text-align:center;font-size:26px;letter-spacing:.35em;font-weight:700}
.acc-card .tint{flex:none}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;background:var(--grad)}
.acc-card .grid2{align-items:stretch}.acc-card .btn{white-space:nowrap;padding:12px 8px;font-size:14px}
.brand{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-weight:800;font-size:13px;color:#fff}.brand.g{background:#4285f4}.brand.y{background:#fc3f1d}

.auth-logo{position:relative;overflow:hidden}
.av{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;background:var(--surface)}
.acc-card .tint{position:relative;overflow:hidden}

/* ===== v5: «Чернила» — стиль под иконку приложения ===== */
[data-theme=dark][data-scheme=ink]{--bg:#090a11;--surface:#12131d;--surface2:#1b1d2b;--accent:#7b95ff;--g1:#5f7bff;--g2:#9189ff}
[data-theme=light][data-scheme=ink]{--bg:#f1f2f9;--surface:#fff;--surface2:#eceef8;--accent:#4560ea;--g1:#4560ea;--g2:#7a72f0}
:root{--r:22px}
body{background:radial-gradient(520px 340px at 50% -90px,color-mix(in srgb,var(--g1) 24%,transparent),transparent 72%),var(--bg)}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;gap:12px}
header h1{font-size:25px;margin:0;letter-spacing:-.03em}
header .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 3px}
.hav{position:relative;width:46px;height:46px;border-radius:15px;padding:0;border:1px solid var(--line);background:var(--surface);overflow:hidden;flex:none;cursor:pointer;box-shadow:0 8px 20px -10px var(--glow)}
.hav img{width:100%;height:100%;object-fit:cover;display:block}
.hav .dot{position:absolute;right:3px;bottom:3px;width:11px;height:11px;border-radius:50%;background:var(--faint);border:2px solid var(--bg)}
.hav .dot.on{background:var(--ok)}
h2{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 4px 10px}
h2 a{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;margin-left:auto}
.card{border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 90%,#fff 10%),var(--surface))}
[data-theme=light] .card{background:var(--surface);box-shadow:0 10px 24px -16px rgba(30,41,90,.25)}
nav{border-radius:28px;background:color-mix(in srgb,var(--surface) 76%,transparent);border:1px solid var(--line);box-shadow:0 20px 44px -14px rgba(0,0,0,.6)}
nav button.active{color:var(--text);font-weight:700}
nav button.active .nv{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px var(--glow)}
.hero{background:radial-gradient(280px 170px at 100% 0%,color-mix(in srgb,var(--g1) 60%,transparent),transparent 72%),radial-gradient(220px 140px at 0% 100%,color-mix(in srgb,var(--g2) 25%,transparent),transparent 70%),linear-gradient(150deg,#1b1e38,#0f1120);border:1px solid rgba(255,255,255,.09);box-shadow:0 22px 44px -22px var(--glow)}
.hero::before{width:200px;height:200px;right:-60px;top:-80px;background:var(--grad);opacity:.28;filter:blur(36px)}
.hero::after{display:none}
.hero .big-n{font-size:56px;font-weight:800;letter-spacing:-.045em;line-height:1}
.hero .ring{background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.hero .ring i{background:#12142a;color:#fff}
.hero-stats span{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08)}
.btn{border-radius:16px;font-weight:700}
.btn.sec{background:var(--surface2);border:1px solid var(--line);color:var(--text)}
.tint{border-radius:13px}
.act{border:1px solid var(--line)}
.fab{background:var(--grad)}
#toast{display:flex;align-items:center;pointer-events:none}
#toast.show{pointer-events:auto}
#toast button{margin-left:14px;background:none;border:0;color:var(--accent);font:inherit;font-weight:800;cursor:pointer;padding:2px 0}
.searchbar{display:flex;align-items:center;gap:10px;padding-left:16px;color:var(--muted)}
.searchbar input{flex:1;border:0;background:transparent;margin:0;box-shadow:none}
.chev{color:var(--faint);display:flex}
.badge{white-space:nowrap}

/* ===== v6: аккуратнее — спокойнее, плоско, ровные отступы ===== */
:root{--r:18px;--accent-soft:rgba(123,149,255,.16);--glow:rgba(95,123,255,.28)}
[data-theme=light]{--accent-soft:rgba(69,96,234,.12)}
body{background:var(--bg)}
@supports (background:color-mix(in srgb,red,blue)){
  :root{--accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);--glow:color-mix(in srgb,var(--accent) 30%,transparent)}
  body{background:radial-gradient(480px 220px at 50% -60px,color-mix(in srgb,var(--accent) 10%,transparent),transparent 75%),var(--bg)}
}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 6px;gap:10px}
header h1{font-size:23px;font-weight:700;letter-spacing:-.02em}
header .sub{font-size:10.5px;letter-spacing:.08em;margin-bottom:2px;font-weight:600}
.hav{width:42px;height:42px;border-radius:13px;box-shadow:none}
.hav .dot{width:10px;height:10px}
main,#view{--gap:10px}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:none;border-radius:var(--r)}
[data-theme=light] .card{box-shadow:0 1px 2px rgba(30,41,90,.06)}
h2{font-size:11.5px;letter-spacing:.08em;margin:20px 4px 8px;font-weight:600}
.title{font-weight:600}
nav{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
nav button{font-size:10.5px;font-weight:500}
nav button.active{color:var(--accent);font-weight:600}
nav button.active .nv{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.hero{background:var(--surface);border:1px solid var(--line);box-shadow:none;color:var(--text);padding:18px}
.hero::before{display:none}
.hero .meta{color:var(--muted)}
.hero .big-n{font-size:46px;font-weight:700;letter-spacing:-.04em}
.hero .ring{background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0)}
.hero .ring i{background:var(--surface);color:var(--text)}
.hero-stats span{background:var(--surface2);border:0;color:var(--muted);font-weight:500}
.hero-stats .ic{color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);box-shadow:none;border-radius:14px;font-weight:600}
.btn.sec{background:var(--surface2);border:0;color:var(--text)}
.ibtn.acc{background:var(--accent);box-shadow:none}
.fab{background:var(--accent);box-shadow:0 8px 20px -6px var(--glow)}
.bar i,.hab .bar i{background:var(--accent)}
.act{border:0;background:var(--surface);border:1px solid var(--line)}
.kpi,.tip{border:1px solid var(--line)}
.chart .col.on i{background:var(--accent);box-shadow:none}
.streak{font-weight:600}
.auth-logo{box-shadow:none;background:var(--surface)}
.auth-box h1{font-weight:700}
.auth-box .btn.big{box-shadow:none}
#sheet .box{border:1px solid var(--line)}

/* ===== значки ===== */
#pick .bd{position:fixed;inset:0;background:rgba(5,8,12,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;animation:fade .2s both}
#pick .box{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;z-index:21;max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:slide .32s var(--ease) both;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
#pick .box::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--faint);opacity:.5;margin:9px auto 0}
#pick .sh{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 8px}
#pick .sh b{font-size:19px;letter-spacing:-.02em}
#pick .sb{overflow:auto;padding:6px 20px 20px}
#pick .box{border:1px solid var(--line)}
#pick{position:fixed;inset:0;z-index:60}
#pick.hidden{display:none}
.flat .a{fill:currentColor}.flat .b{fill:currentColor;opacity:.42}
.uic{display:inline-block;vertical-align:middle;flex:none}
img.uic{border-radius:22%;object-fit:cover}
.uic.em{text-align:center}
nav .nv .uic{width:23px;height:23px}
.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.icc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:16px;background:var(--surface2);color:var(--accent);cursor:pointer;padding:0}
.icc.on{border-color:var(--accent);background:var(--accent-soft)}
.icc:active{transform:scale(.94)}
.icbtn{width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--accent);flex:none}
nav button{min-width:0}nav button>span:last-child{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== v7 modern "bento" ===== */
[data-ui=bento]{--r:26px}
[data-ui=bento] body{background:var(--bg)}
[data-ui=bento] header{padding:calc(14px + env(safe-area-inset-top)) 18px 8px}
[data-ui=bento] header h1{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
[data-ui=bento] header .sub{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted);margin-bottom:4px}
[data-ui=bento] #hAcc{width:46px;height:46px;border-radius:50%;overflow:hidden;padding:0;border:2px solid var(--accent)}
[data-ui=bento] #hAcc img{width:100%;height:100%;object-fit:cover;border-radius:50%}
[data-ui=bento] h2{text-transform:none;letter-spacing:-.02em;font-size:19px;font-weight:800;color:var(--text)}
[data-ui=bento] .card{background:var(--surface);border:0;border-radius:26px;box-shadow:none;padding:16px}
[data-ui=bento][data-theme=light] .card{box-shadow:0 1px 0 rgba(30,41,90,.04),0 12px 28px -20px rgba(30,41,90,.25)}
[data-ui=bento] .btn,[data-ui=bento] .chip{border-radius:999px}
[data-ui=bento] .btn{padding:13px 20px}
[data-ui=bento] input,[data-ui=bento] select,[data-ui=bento] textarea{border-radius:18px;border:0;background:var(--surface2)}
[data-ui=bento] .hero{border:0;border-radius:32px;padding:22px;color:#fff;background:radial-gradient(260px 180px at 100% 0%,color-mix(in srgb,var(--g1) 85%,transparent),transparent 70%),radial-gradient(220px 160px at 0% 100%,color-mix(in srgb,var(--g2) 55%,transparent),transparent 70%),linear-gradient(150deg,#1d2040,#10122a);box-shadow:0 24px 48px -24px var(--glow)}
[data-ui=bento] .hero .meta{color:rgba(255,255,255,.7)}
[data-ui=bento] .hero .big-n{font-size:64px;font-weight:800;letter-spacing:-.05em;color:#fff}
[data-ui=bento] .hero .ring{background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
[data-ui=bento] .hero .ring i{background:#171a36;color:#fff}
[data-ui=bento] .hero-stats span{background:rgba(255,255,255,.14);color:#fff;border-radius:999px}
[data-ui=bento] .hero-stats .ic{color:#fff}
[data-ui=bento] nav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));border:0;border-radius:999px;padding:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px -14px rgba(0,0,0,.55)}
[data-ui=bento] nav button{flex-direction:row;justify-content:center;gap:6px;border-radius:999px;padding:10px 0;color:var(--muted);transition:all .25s}
[data-ui=bento] nav button>span:last-child{display:none}
[data-ui=bento] nav button.active{flex:2.2;background:var(--accent);color:var(--accent-ink)}
[data-ui=bento] nav button.active>span:last-child{display:inline;font-size:12.5px;font-weight:700;color:var(--accent-ink)}
[data-ui=bento] nav button.active .nv,[data-ui=bento] nav .nv{background:none;box-shadow:none;color:inherit;width:auto;height:auto}
[data-ui=bento] .fab{border-radius:22px;width:58px;height:58px;background:var(--accent);bottom:calc(92px + env(safe-area-inset-bottom))}
[data-ui=bento] .bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:132px;padding:16px;border:0;border-radius:26px;color:var(--text);cursor:pointer;background:var(--surface);transition:transform .15s}
[data-ui=bento] .tile{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.tile:active{transform:scale(.96)}
.tile.wide{grid-column:span 2;min-height:104px}
.tile .ti{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;position:relative;z-index:1}
.tile .ti svg{width:20px;height:20px}
.tile .tb{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tile b small{font-size:14px;font-weight:600;opacity:.7}
.tile .tb>span{font-size:12.5px;color:var(--muted);font-weight:600}
.tile.fill::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*1%);background:color-mix(in srgb,var(--c) 35%,transparent);transition:height .5s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
main.anim .tile,main.anim .hero{animation:rise .45s var(--ease) both}
main.anim .tile:nth-child(2){animation-delay:.05s}main.anim .tile:nth-child(3){animation-delay:.1s}main.anim .tile:nth-child(4){animation-delay:.15s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[data-ui=classic] .bento{display:none}
@supports not (color:color-mix(in srgb,red 20%,blue)){[data-ui=bento] .tile{background:var(--surface)}}

/* v8 calmer home + settings hub */
[data-ui=bento] .hero-stats{display:none}
[data-ui=bento] .hero{padding:22px 22px 20px}
.navrow .chev{color:var(--faint);font-size:22px;line-height:1;margin-left:4px}
.prof{padding:16px!important}.prof .pav{width:56px;height:56px;border-radius:50%;object-fit:cover;margin-right:4px}
.prof .title{font-size:18px;font-weight:800}
[data-ui=bento] .group{gap:8px}
[data-ui=bento] .seg,[data-ui=bento] .segs{border-radius:999px}

/* v9 avatars, smooth taps, no overlaps */
html{-webkit-tap-highlight-color:transparent}
button,.btn,.chip,.card,.tile,.navrow,[data-go],nav button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn,.chip,.tile,.fab,.card.li,.navrow,nav button,.hav,input,select{transition:transform .22s cubic-bezier(.2,.8,.2,1),background-color .25s ease,color .25s ease,opacity .25s ease,box-shadow .25s ease,border-color .25s ease,flex .3s cubic-bezier(.2,.8,.2,1)}
button:active,.btn:active,.chip:active,.hav:active{transform:scale(.95)}
.card.li:active,.navrow:active,[data-go].card:active{transform:scale(.985)}
.tile:active{transform:scale(.965)}
#sheet .box{animation-duration:.38s}
#sheet .bd{animation-duration:.3s}
main{scroll-behavior:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:190px}
.fab{right:max(18px,calc(50% - 362px));bottom:calc(98px + env(safe-area-inset-bottom));width:54px;height:54px}
[data-ui=bento] .fab{bottom:calc(98px + env(safe-area-inset-bottom));width:54px;height:54px}
.hav,[data-ui=bento] #hAcc{position:relative;width:46px;height:46px;border-radius:16px;padding:2px;border:0;overflow:visible;background:var(--grad);box-shadow:0 8px 20px -8px var(--glow)}
.hav img,[data-ui=bento] #hAcc img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block;background:var(--surface);border:2px solid var(--bg)}
.hav .dot{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border:2.5px solid var(--bg);box-sizing:border-box}
.prof .pav{width:60px;height:60px;border-radius:20px;padding:2px;background:var(--grad);box-shadow:0 10px 22px -10px var(--glow);object-fit:cover}
@media(prefers-reduced-motion:reduce){button:active,.tile:active{transform:none}}
[data-ui=bento] .group{display:flex;flex-direction:column;gap:8px}
[data-ui=bento] .group>.card,[data-ui=bento] .group>.card+.card{margin:0;border-radius:22px;border-top:0}
[data-ui=bento] .group>.card::before,[data-ui=bean] .x{display:none}

/* v10 forms + lists */
[data-ui=bento] .li{border-radius:20px;margin-bottom:8px}
[data-ui=bento] .group>.li,[data-ui=bento] .group>.card{margin:0}
[data-ui=bento] .li+.li{border-top:0}
#sheet .sb{padding:4px 20px 24px}
#sheet label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 0 8px;letter-spacing:.01em}
#sheet input.big{font-size:20px;font-weight:700;padding:16px 18px;border-radius:20px;letter-spacing:-.01em;margin:6px 0 4px}
#sheet input,#sheet select{margin-bottom:0}
.seg2{display:flex;flex-wrap:wrap;gap:8px}
.seg2 button{flex:1 1 auto;padding:11px 14px;border:0;border-radius:999px;background:var(--surface2);color:var(--muted);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.seg2 button.on{background:var(--accent);color:var(--accent-ink)}
.qc{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;padding-bottom:2px}
.qc::-webkit-scrollbar{display:none}
.qc button{flex:none;padding:9px 14px;border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sws button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.sws button.on{border-color:var(--text);transform:scale(1.08)}
#sheet .grid2:last-child,#sheet .sb>.grid2:last-of-type{margin-top:22px}
#sheet #f_ok{padding:15px;font-size:16px}
.soon{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:20px;padding:14px 16px;margin:0 0 10px;background:var(--accent-soft);color:var(--text);font:inherit;cursor:pointer}
.soon .sd{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
.soon b{display:block;font-size:15px}.soon small{color:var(--muted);font-size:12.5px;font-weight:600}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.idcard{display:flex;flex-direction:column;gap:4px;align-items:center;padding:16px;border-radius:20px;background:var(--surface2);margin:10px 0}
.idcard span{font-size:12px;color:var(--muted);font-weight:600}.idcard b{font-size:28px;letter-spacing:.08em;font-weight:800}
.steps{text-align:left;color:var(--muted);font-size:13.5px;line-height:1.5;padding-left:20px;margin:6px 0 12px}
.swl{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 !important;font-size:15px !important;color:var(--text) !important}
#sheet .grid2:has(>span:empty){grid-template-columns:1fr}
#sheet .grid2>span:empty{display:none}
#sheet input.big{text-align:left}
.qc{flex-wrap:wrap;overflow:visible}
#sheet .chips .chip{background:var(--surface2);padding:10px 14px}#sheet .chips .chip.active{background:var(--accent);color:var(--accent-ink)}

</style>
</head>

/* значение значка: "i:имя" — встроенный, "data:image…" — своя картинка, иначе — эмодзи/текст */
function uic(val, size = 22) {
  if (!val) return "";
  if (val.startsWith("data:image")) return `<img class="uic" src="${val}" width="${size}" height="${size}" alt="">`;
  if (val.startsWith("i:")) return `<svg class="uic flat" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${FLAT[val.slice(2)] || ""}</svg>`;
  return `<span class="uic em" style="font-size:${Math.round(size * 0.82)}px;line-height:${size}px;width:${size}px">${esc(val)}</span>`;
}
const iconText = v => (v && !v.startsWith("i:") && !v.startsWith("data:")) ? v : "";
/* значок раздела: пользовательский или стандартный плоский */
const SEC_DEFAULT = { more: "grid", shop: "cart", vault: "lock", bot: "user", settings: "gear", search: "sparkles" };
const secIconVal = id => (S.settings.icons || {})[id] || "i:" + (SEC_DEFAULT[id] || (NAV_META[id] && NAV_META[id][1]) || "grid");
const sec = (id, size = 22) => uic(secIconVal(id), size);
const secTile = (id, color, size = 38) => `<span class="tint" style="--c:${color};width:${size}px;height:${size}px">${sec(id, Math.round(size * 0.6))}</span>`;

/* ----- выбор значка ----- */
const EMOJI = "✅ 📖 🎓 🧹 ☕ 🏃 💧 🧘 🛌 🍎 ✍️ 🇬🇧 💪 🥗 🚭 💊 🧠 🎯 🎸 🎨 📷 🌱 🐶 🐱 🚴 🏊 🧺 🛒 💼 📞 💡 🔥 ⭐ ❤️ 🌙 ☀️ 🎧 🎮 📚 ✈️ 🚗 🏠 💰 🎁 🧩 🕘 📝 🔔 🍳 🥤 🧴 🪥 🚿 🧘‍♀️ 🏋️ 🥇 📈".split(" ");
function openIconPicker(cur, onPick, opts = {}) {
  let host = $("#pick"); if (!host) { host = document.createElement("div"); host.id = "pick"; document.body.appendChild(host); }
  let tab = cur && cur.startsWith("data:") ? "own" : cur && cur.startsWith("i:") ? "flat" : cur ? "emoji" : "flat";
  const close = () => { host.classList.add("hidden"); host.innerHTML = ""; };
  const pick = v => { close(); onPick(v); };
  const draw = () => {
    host.classList.remove("hidden");
    const body = tab === "flat" ? `<div class="icgrid">${FLAT_NAMES.map(n => `<button class="icc ${cur === "i:" + n ? "on" : ""}" data-v="i:${n}" aria-label="${n}"><svg class="flat" viewBox="0 0 24 24" width="32" height="32">${FLAT[n]}</svg></button>`).join("")}</div>`
      : tab === "emoji" ? `<div class="icgrid">${EMOJI.map(e => `<button class="icc ${cur === e ? "on" : ""}" data-v="${e}"><span style="font-size:26px">${e}</span></button>`).join("")}</div>

  try { TG.sendData(d); } catch (e) { toast("Не удалось отправить: откройте приложение кнопкой «Синхронизация» в чате с ботом"); }
}

/* входящие данные от бота: ?d=<gzip+base64url> */
async function handleInbound() {
  const q = new URLSearchParams(location.search), d = q.get("d");
  if (!d) return;
  try {
    const o = JSON.parse(await ungz(d));
    let n = 0;
    S.seen = S.seen || {};
    const fresh = id => { if (S.seen[id]) return false; S.seen[id] = 1; return true; };
    (o.rem || []).forEach(r => { if (fresh("r" + r.id)) { S.reminders.push({ id: "b" + r.id, title: r.title, at: r.at, repeat: r.repeat || "none", days: [], prio: r.prio || 2, cat: "life", pre: [0], done: false, fk: [] }); n++; } });
    (o.tasks || []).forEach(t => { if (fresh("t" + t.id)) { S.tasks.push({ id: "b" + t.id, title: t.title, due: t.due || null, prio: t.prio || 2, cat: "life", project: "", subs: [], repeat: "none", done: false }); n++; } });
    (o.water || []).forEach(w => { if (fresh("w" + w.id)) { S.water.push({ id: "b" + w.id, ts: w.ts, ml: w.ml }); n++; } });
    (o.tx || []).forEach(x => { if (fresh("x" + x.id)) { S.tx.push({ id: "b" + x.id, type: x.type, amt: x.amt, cat: x.cat, note: x.note || "", ts: x.ts }); n++; } });
    (o.hab || []).forEach(m => { const h = S.habits.find(z => z.id === m.hid); if (h && !h.log[m.date]) { h.log[m.date] = true; n++; } });
    save(false);
    toast(n ? `Получено из бота: ${n}` : "Всё уже было получено");
  } catch (e) { toast("Не удалось прочитать данные из бота"); }
  history.replaceState(null, "", location.pathname);
}

/* резервная копия в облако Telegram (до ~350 КБ, без фотографий) */
const CHUNK = 3500;
async function cloudBackup(quiet) {
  if (!inTG || !TG.CloudStorage) return quiet || toast("Доступно только внутри Telegram");
  const copy = JSON.parse(JSON.stringify(S)); copy.notes.forEach(n => { n.img = null; });
  const z = typeof CompressionStream === "undefined" ? null : await gz(JSON.stringify(copy));
  if (!z) return toast("Браузер не поддерживает сжатие");
  const parts = []; for (let i = 0; i < z.length; i += CHUNK) parts.push(z.slice(i, i + CHUNK));
  if (parts.length > 100) return toast("Данных слишком много для облака Telegram");
  const items = { pl_n: String(parts.length), pl_rev: String(S.rev) };
  parts.forEach((p, i) => { items["pl_" + i] = p; });
  const keys = Object.keys(items);
  let left = keys.length, failed = false;
  keys.forEach(k => TG.CloudStorage.setItem(k, items[k], (err, ok) => { if (err || !ok) failed = true; if (--left === 0) { if (failed) toast("Копия сохранена не полностью"); else if (!quiet) toast(`Копия сохранена (${parts.length} ч.)`); } }));
}
function cloudRestore(auto) {
  if (!inTG || !TG.CloudStorage) return auto === true || toast("Доступно только внутри Telegram");
  TG.CloudStorage.getItem("pl_n", async (e, nStr) => {
    const n = +nStr; if (e || !n) return auto === true || toast("В облаке копии нет");
    const keys = Array.from({ length: n }, (_, i) => "pl_" + i);
    TG.CloudStorage.getItems(keys, async (err, vals) => {
      if (err) return toast("Не удалось прочитать копию");
      try {
        const o = JSON.parse(await ungz(keys.map(k => vals[k]).join("")));
        if (auto !== true && !confirm("Заменить текущие данные копией из облака Telegram?")) return;
        const imgs = Object.fromEntries(S.notes.map(x => [x.id, x.img]));
        const acc = S.account;
        S = Object.assign(def(), o); S.settings = Object.assign(def().settings, o.settings || {}); S.account = acc;
        const st = S.settings; if (!Array.isArray(st.nav) || !st.nav.length) st.nav = def().settings.nav; if (!Array.isArray(st.widgets)) st.widgets = def().settings.widgets;
        S.notes.forEach(x => { if (imgs[x.id]) x.img = imgs[x.id]; });
        const rev = +o.rev || Date.now(); S.rev = rev; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e2) { /* игнор */ }
        toast(auto === true ? "Данные синхронизированы с аккаунтом Telegram" : "Данные восстановлены"); render();
      } catch (ex) { toast("Копия повреждена"); }
    });
  });
}

/* автосинхронизация по аккаунту Telegram: побеждает более новая копия */
let syncT, lastCloud = 0, lastCheck = 0;
function scheduleSync() {
  if (!inTG || guest()) return;
  clearTimeout(syncT);
  const wait = Math.max(5000, 60000 - (Date.now() - lastCloud));
  syncT = setTimeout(() => { lastCloud = Date.now(); cloudBackup(true).catch(() => { }); }, wait);
}
function cloudSyncStart() {
  if (!inTG || guest() || !TG.CloudStorage || Date.now() - lastCheck < 20000) return;
  lastCheck = Date.now();
  TG.CloudStorage.getItem("pl_rev", (e, v) => {
    if (e) return;
    const cr = +v || 0;
    if (cr > S.rev) cloudRestore(true);
    else if (cr < S.rev) { lastCloud = Date.now(); cloudBackup(true).catch(() => { }); }
  });
}
function shareText(text) {
  const url = "https://t.me/share/url?url=" + encodeURIComponent(location.origin + location.pathname) + "&text=" + encodeURIComponent(text);
  if (inTG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, "_blank");
}

/* текстовая синхронизация: копируем данные и отправляем боту сообщением */
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {
    try { const a = document.createElement("textarea"); a.value = s; a.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(a); a.select(); const ok = document.execCommand("copy"); a.remove(); return ok; } catch (e2) { return false; }
  }
}
async function copySyncForBot() {
  const d = await buildSyncData();
  if (!d) return toast("Слишком много данных — удалите старое");
  toast((await copyText(d)) ? "Скопировано — вставьте в чат с ботом и отправьте" : "Не удалось скопировать");
}

</script>
<script>
"use strict";

let UNDO = null;

function undoNow(snap) { const acc = S.account; S = Object.assign(def(), JSON.parse(snap)); S.account = acc; save(); render(); toast("Восстановлено"); }
function buzz(kind) { try { if (typeof TG !== "undefined" && TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred(kind || "light"); else if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* игнор */ } }

document.addEventListener("click", e => {

const val = id => { const e = $("#" + id); return e ? e.value : ""; };
function chipToggle(root, sel) { $$(sel, root).forEach(c => c.onclick = () => c.classList.toggle("active")); }

const catOpts = sel => S.cats.map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("");
function after() { save(); closeSheet(); render(); }
function voiceInput(cb) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Голосовой ввод не поддерживается этим браузером");
  try {
    const r = new SR(); r.lang = "ru-RU"; r.interimResults = false;
    r.onresult = e => cb(e.results[0][0].transcript);

}
function askNotify() {

}

/* ---------- напоминание ---------- */
function remForm(id, pref) {

  sheet(r ? "Напоминание" : "Новое напоминание", `
        <div class="row" style="margin-bottom:8px"><input id="f_t" class="big" placeholder="О чём напомнить?" value="${esc(v.title)}" style="margin:0"><button class="btn sec" id="f_mic">🎤</button></div>
    <label>Когда</label><div class="qc" id="f_q"><button type="button" data-m="15">+15 мин</button><button type="button" data-m="60">+1 час</button><button type="button" data-m="eve">Вечером</button><button type="button" data-m="tom">Завтра 9:00</button></div><input id="f_at" type="datetime-local" value="${toLocalInput(v.at)}">

    <div id="f_days" class="chips ${v.repeat === "custom" ? "" : "hidden"}">${[1, 2, 3, 4, 5, 6, 0].map(d => `<span class="chip ${(v.days || []).includes(d) ? "active" : ""}" data-d="${d}">${DAYS[d]}</span>`).join("")}</div>

      $("#f_rep").onchange = e => $("#f_days").classList.toggle("hidden", e.target.value !== "custom");

}
function snoozeSheet(id) {

/* ---------- привычка ---------- */
function habitForm(id) {
  const h = id ? S.habits.find(x => x.id === id) : null;
  const v = h || { name: "", icon: "✅", color: "#5fae8a", goal: { type: "daily", n: 1 }, remind: "" };
  let curIcon = v.icon;
  sheet(h ? "Привычка" : "Новая привычка", `
    <input id="f_t" class="big" value="${esc(v.name)}" placeholder="Например: читать 20 минут" autocomplete="off">
    <label>Значок</label><div class="row"><button type="button" class="icbtn" id="f_icb" aria-label="Выбрать значок">${uic(v.icon, 32)}</button><div class="meta grow">Нажмите, чтобы выбрать значок, эмодзи или загрузить свою картинку</div></div>
    <div class="grid2"><div><label>Цель</label>${seg("f_g", { daily: "Каждый день", week: "Раз в неделю" }, v.goal.type)}</div>
    <div><label>Раз в неделю</label><input id="f_n" type="number" min="1" max="7" value="${v.goal.n || 3}"></div></div>
    <div class="grid2"><div><label>Напомнить в</label><input id="f_r" type="time" value="${v.remind || ""}"></div><div><label>Цвет</label>${swatches("f_c", v.color)}</div></div>
    <div class="grid2"><button class="btn" id="f_ok">Сохранить</button>${h ? '<button class="btn bad" id="f_del">Удалить</button>' : "<span></span>"}</div>`,
    w => {
      $("#f_icb").onclick = () => openIconPicker(curIcon, nv => { if (nv) { curIcon = nv; $("#f_icb").innerHTML = uic(nv, 32); } });
      $("#f_ok").onclick = () => {
        const name = val("f_t").trim(); if (!name) return toast("Введите название");
        const type = val("f_g");
        const o = { name, icon: curIcon || "✅", color: val("f_c"), goal: { type, n: type === "week" ? Math.max(1, Math.min(7, +val("f_n") || 3)) : 1 }, remind: val("f_r") };
        if (h) Object.assign(h, o); else S.habits.push({ id: uid(), log: {}, ...o });
        after();
      };
      if (h) $("#f_del").onclick = () => { if (confirm("Удалить привычку и её историю?")) { S.habits = S.habits.filter(x => x.id !== id); after(); } };
    });
}

</script>
<script>
"use strict";
/* ============ маршрутизация ============ */
let R = { tab: "home", screen: null, arg: null };
const TABVIEWS = {}, SCREENS = {}, SCR_TITLES = {};
const NAVIC = { home: "home", cal: "calendar", tasks: "tasks", habits: "flame", fin: "wallet", more: "grid" };
const TAB_NAMES = { home: "Главная", cal: "Календарь", tasks: "Задачи", habits: "Привычки", fin: "Финансы", more: "Ещё" };
function go(tab, screen, arg) { R = { tab, screen: screen || null, arg: arg || null }; const mv = $("#view"); if (mv) { mv.classList.add("anim"); clearTimeout(go.t); go.t = setTimeout(() => mv.classList.remove("anim"), 600); } render(); const v = $("#view"); if (v) v.scrollTop = 0; }
function navGo(id) { if (id === "more" || TABVIEWS[id]) go(id); else go("more", id); }
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
}
function render() {
  const nav = $("#nav"), ids = [...S.settings.nav, "more"];
  const act = id => id === "more" ? (R.tab === "more" && !(R.screen && S.settings.nav.includes(R.screen))) : (R.screen ? R.screen === id : R.tab === id);
  nav.innerHTML = ids.map(id => `<button class="${act(id) ? "active" : ""}" data-t="${id}"><span class="nv">${sec(id, 23)}</span><span>${id === "more" ? "Ещё" : NAV_META[id][0]}</span></button>`).join("");
  $$("button", nav).forEach(b => b.onclick = () => { buzz(); navGo(b.dataset.t); });
  const n = new Date();
  const name = (inTG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.first_name) || "";
  $("#hTitle").textContent = R.screen ? (SCR_TITLES[R.screen] || "") : (R.tab === "home" ? greeting() + (name ? ", " + name : "") : (TAB_NAMES[R.tab] || ""));
  $("#hSub").textContent = `${DAYS_FULL[n.getDay()].replace(/^./, c => c.toUpperCase())}, ${n.getDate()} ${MONTHS[n.getMonth()]}`;
  $("#hBack").classList.toggle("hidden", !R.screen || S.settings.nav.includes(R.screen));
  document.body.classList.toggle("sub", !!R.screen);
  $("#hLock").classList.toggle("hidden", !S.settings.pin);
  $("#hAcc").classList.toggle("hidden", !!R.screen && !S.settings.nav.includes(R.screen) ? true : !!R.screen);
  $("#hSearch").classList.toggle("hidden", R.screen === "search");
  const v = $("#view");
  const fn = R.screen ? SCREENS[R.screen] : TABVIEWS[R.tab];
  v.innerHTML = "";
  (fn || (() => { }))(v);
  applyTheme();
}
function applyTheme() {
  let th = S.settings.theme;
  if (th === "auto") th = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = th; document.documentElement.dataset.scheme = S.settings.scheme; document.documentElement.dataset.ui = S.settings.ui || "bento";
  const c = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const m = $("#themeColor"); if (m && c) m.content = c;
  if (inTG) { try { TG.setHeaderColor(c); TG.setBackgroundColor(c); } catch (e) { /* игнор */ } }
}
function fab(fn) { const b = document.createElement("button"); b.className = "fab"; b.innerHTML = ic("plus", 26); b.setAttribute("aria-label", "Добавить"); b.onclick = fn; $("#view").appendChild(b); }
function dayLabel(ts) {
  const k = dkey(new Date(ts));
  if (k === todayKey()) return "Сегодня";
  if (k === dkey(addDays(new Date(), 1))) return "Завтра";
  if (k === dkey(addDays(new Date(), -1))) return "Вчера";
  return fmtDate(k);
}
const keyLabel = k => k === todayKey() ? "Сегодня" : k === dkey(addDays(new Date(), 1)) ? "Завтра" : k === dkey(addDays(new Date(), -1)) ? "Вчера" : fmtDate(k);
const empty = t => `<div class="empty">${t}</div>`;

/* ============ строки списков ============ */
function remRow(r) {
  const c = catOf(r.cat), p = PRIO[r.prio || 2];
  return `<div class="card li" data-id="${r.id}" data-k="rem">
    <div class="chk ${r.done ? "done" : ""}" data-act="done"></div>
    <div class="grow" data-act="edit"><div class="title ${r.done ? "done-t" : ""}">${esc(r.title)}</div>
    <div class="meta"><span class="cdot" style="background:${c.color}"></span>${dayLabel(r.at)}, ${fmtT(r.at)}${r.repeat !== "none" ? ` · ${ic("repeat", 13)}${REPEAT[r.repeat].toLowerCase()}` : ""} ${(r.prio || 2) !== 2 ? `· <span class="badge ${p[1]}">${p[0]}</span>` : ""}</div></div>
    ${r.done ? "" : `<button class="ibtn sm" data-act="snooze" aria-label="Отложить">${ic("clock", 17)}</button>`}</div>`;
}
function bindRem(root) {
  $$('[data-k="rem"] [data-act]', root).forEach(el => el.onclick = () => {
    const id = el.closest("[data-id]").dataset.id, r = S.reminders.find(x => x.id === id); if (!r) return;
    const a = el.dataset.act;
    if (a === "edit") return remForm(id);
    if (a === "snooze") return snoozeSheet(id);
    r.done = !r.done; r.doneAt = r.done ? Date.now() : null;
    if (r.done && r.repeat !== "none") { r.at = nextRepeat(r.at, r.repeat, r.days); r.done = false; r.fk = []; toast("Следующее: " + fmtDT(r.at)); }
    save(); render();
  });
}
const taskOpen = new Set();
function taskRow(t) {
  const p = PRIO[t.prio || 2], subs = t.subs || [], sd = subs.filter(s => s.done).length;
  const open = taskOpen.has(t.id), over = !t.done && t.due && t.due < todayKey();
  return `<div class="card li col" data-id="${t.id}" data-k="task">
    <div class="row"><div class="chk ${t.done ? "done" : ""}" data-act="done"></div>
    <div class="grow" data-act="open"><div class="title ${t.done ? "done-t" : ""}">${esc(t.title)}</div>
    <div class="meta"><span class="cdot" style="background:${catOf(t.cat).color}"></span>${t.due ? `<span style="${over ? "color:var(--bad);font-weight:600" : ""}">${keyLabel(t.due)}</span>` : ""}${(t.prio || 2) !== 2 ? ` · <span class="badge ${p[1]}">${p[0]}</span>` : ""}${t.project ? " · " + esc(t.project) : ""}${t.repeat && t.repeat !== "none" ? " · " + ic("repeat", 13) : ""}${subs.length ? ` · ${sd}/${subs.length}` : ""}</div></div>
    <button class="ibtn sm" data-act="edit" aria-label="Изменить">${ic("edit", 16)}</button></div>
    ${subs.length ? `<div class="bar ${sd === subs.length ? "ok" : ""}" style="margin-left:38px"><i style="width:${Math.round(sd / subs.length * 100)}%"></i></div>` : ""}
    ${open ? `<div style="margin:10px 0 0 38px">${subs.map(s => `<div class="row" style="margin:8px 0" data-sid="${s.id}"><div class="chk ${s.done ? "done" : ""}" data-act="sdone" style="width:21px;height:21px"></div><div class="grow ${s.done ? "done-t" : ""}">${esc(s.t)}</div><button class="ibtn sm" data-act="sdel" aria-label="Удалить">${ic("x", 15)}</button></div>`).join("")}
      <div class="row" style="margin-top:6px"><input data-sub placeholder="Новая подзадача" style="margin:0"><button class="ibtn acc" data-act="sadd" aria-label="Добавить">${ic("plus", 18)}</button></div></div>` : ""}</div>`;
}
function bindTask(root) {
  $$('[data-k="task"] [data-act]', root).forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    const card = el.closest("[data-id]"), t = S.tasks.find(x => x.id === card.dataset.id); if (!t) return;
    const a = el.dataset.act, sid = el.closest("[data-sid]") && el.closest("[data-sid]").dataset.sid;
    if (a === "edit") return taskForm(t.id);
    if (a === "open") { taskOpen.has(t.id) ? taskOpen.delete(t.id) : taskOpen.add(t.id); return render(); }
    if (a === "done") toggleTask(t);
    else if (a === "sdone") { const s = t.subs.find(x => x.id === sid); if (s) s.done = !s.done; }
    else if (a === "sdel") t.subs = t.subs.filter(x => x.id !== sid);
    else if (a === "sadd") { const i = $("[data-sub]", card), txt = i.value.trim(); if (!txt) return; t.subs.push({ id: uid(), t: txt, done: false }); }
    save(); render();
  });
}

/* ============ ГЛАВНАЯ ============ */
let wxCache = null;
const WX = c => c === 0 ? "ясно" : c <= 3 ? "облачно" : c <= 48 ? "туман" : c <= 57 ? "морось" : c <= 67 ? "дождь" : c <= 77 ? "снег" : c <= 82 ? "ливень" : c >= 95 ? "гроза" : "пасмурно";
async function loadWeather(el) {
  const c = S.settings.city; if (!c || !el) return;
  if (wxCache && wxCache.k === c.name && Date.now() - wxCache.t < 30 * 60e3) { el.innerHTML = wxCache.h; return; }
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`);
    const j = (await r.json()).current;
    const h = `${esc(c.name)}: ${Math.round(j.temperature_2m)}°, ${WX(j.weather_code)}, ветер ${Math.round(j.wind_speed_10m)} км/ч`;
    wxCache = { k: c.name, t: Date.now(), h }; el.innerHTML = h;
  } catch (e) { el.textContent = "Погода недоступна офлайн"; }
}
let HT = "today";
const TIPS = [["Правило двух минут", "Если дело занимает меньше двух минут — сделайте его сразу."], ["Съешьте лягушку", "Начните день с самой неприятной задачи — дальше будет легче."], ["Один фокус", "Выберите на сегодня три главных дела, остальное — бонус."], ["Перерывы работают", "25 минут работы и 5 минут отдыха возвращают концентрацию."], ["Вечерний обзор", "Пять минут вечером на план завтра экономят час утром."], ["Маленькие шаги", "Привычка из двух минут в день закрепляется быстрее большой цели."], ["Вода и сон", "Стакан воды утром и сон до полуночи улучшают продуктивность."]];
function weekData() {
  const s = addDays(new Date(), -monIdx(new Date()));
  return Array.from({ length: 7 }, (_, i) => {
    const d = addDays(s, i), k = dkey(d);
    const done = S.tasks.filter(t => t.done && t.doneAt && dkey(new Date(t.doneAt)) === k).length + S.habits.filter(h => h.log[k]).length;
    const spent = S.tx.filter(t => t.type !== "in" && dkey(new Date(t.ts)) === k).reduce((a, t) => a + t.amt, 0);
    return { k, d, done, spent, water: waterOn(k), foc: S.pomoLog.filter(ts => dkey(new Date(ts)) === k).length, today: k === todayKey() };
  });
}
const bars = (arr, key, fmt) => { const mx = Math.max(1, ...arr.map(x => x[key])); return `<div class="chart">${arr.map(x => `<div class="col ${x[key] ? "on" : ""} ${x.today ? "today" : ""}"><b>${x[key] ? (fmt ? fmt(x[key]) : x[key]) : ""}</b><i style="height:${Math.max(5, Math.round(x[key] / mx * 78))}px"></i><span>${DAYS[x.d.getDay()]}</span></div>`).join("")}</div>`; };
const kpi = (icn, c, val, lab, extra) => `<div class="kpi" style="--c:${c}">${tint(icn, c, 34)}<b>${val}</b><span>${lab}</span>${extra ? `<div><em>${extra}</em></div>` : ""}</div>`;
TABVIEWS.home = function (v) {
  const now = new Date(), k = todayKey(), pr = dayProgress();
  const seg = `<div class="chips seg">${[["today", "Сегодня"], ["week", "Неделя"], ["total", "Итоги"]].map(([a, l]) => `<span class="chip ${HT === a ? "active" : ""}" data-ht="${a}">${l}</span>`).join("")}</div>`;
  let body = "";
  if (HT === "today") {
    const next = S.reminders.filter(r => !r.done && r.at > Date.now() - 600e3).sort((a, b) => a.at - b.at).slice(0, 3);
    const todayTasks = S.tasks.filter(t => !t.done && !t.archived && t.due && t.due <= k).sort((a, b) => a.prio - b.prio);
    const todayEv = itemsOn(k).filter(x => x.src === "ev" || x.src === "sch").length;
    const strip = Array.from({ length: 7 }, (_, i) => { const d = addDays(now, i), key = dkey(d); return { d, key, n: itemsOn(key).filter(x => x.src !== "hol").length }; });
    const wl = waterOn(k), wg = S.settings.waterGoal || 2000, wp = Math.min(100, Math.round(wl / wg * 100));
    const tip = TIPS[(now.getDate() + now.getMonth()) % TIPS.length];
    const sec = (t, go, lab) => `<h2>${t}${go ? ` <a data-go="${go}">${lab || "Все"}</a>` : ""}</h2>`;
    const W = {
      hero: () => `<div class="card hero"><div class="grow"><div class="big-n" id="clk">${pad(now.getHours())}:${pad(now.getMinutes())}</div>
        <div class="meta" id="wx" style="margin-top:4px">${S.settings.city ? "Загрузка погоды…" : '<a href="#" id="wxSet" style="color:#fff;font-weight:600;text-decoration:none">Указать город для погоды</a>'}</div>
        <div class="hero-stats"><span>${ic("tasks", 14)}${pr.openTasks} задач</span><span>${ic("calendar", 14)}${todayEv} событий</span><span>${ic("flame", 14)}${pr.hDone}/${pr.hTotal}</span></div></div>
        <div style="text-align:center"><div class="ring" style="--p:${pr.pct}"><i>${pr.pct}%</i></div><div class="meta" style="margin-top:6px">${pr.total ? `${pr.ok} из ${pr.total}` : "дел нет"}</div></div></div>`,
      bento: () => {
        const nx = next[0], best = S.habits.reduce((a, h) => Math.max(a, habitStreak(h).n), 0);
        const mtx = monthTx(now.getFullYear(), now.getMonth()), bal = mtx.filter(t => t.type === "in").reduce((a, t) => a + t.amt, 0) - mtx.filter(t => t.type !== "in").reduce((a, t) => a + t.amt, 0);
        const foc = S.pomoLog.filter(ts => dkey(new Date(ts)) === k).length;
        const T = (go, c, icn, big, lab, extra, cls) => `<button class="tile ${cls || ""}" style="--c:${c};${extra || ""}" data-go="${go}"><span class="ti">${ic(icn, 20)}</span><span class="tb"><b>${big}</b><span>${lab}</span></span></button>`;
        return `<div class="bento">
          ${T("tasks", "#4fd18f", "tasks", todayTasks.length, "задач на сегодня")}
          ${T("reminders", "#6a8cff", "bell", nx ? fmtT(nx.at) : "—", nx ? esc(nx.title.length > 22 ? nx.title.slice(0, 21) + "…" : nx.title) : "нет напоминаний")}
          ${T("habits", "#ff9a5b", "flame", pr.hDone + "/" + pr.hTotal, best ? "серия " + best + " дн." : "привычки сегодня")}
          <button class="tile fill" style="--c:#4aa8ff;--p:${wp}" data-w="250"><span class="ti">${ic("drop", 20)}</span><span class="tb"><b>${wl}<small> мл</small></b><span>вода · нажмите +250</span></span></button>
        </div>`;
      },
      acts: () => `<div class="acts">${[["bell", "#6a8cff", "Напомнить", "rem"], ["tasks", "#4fd18f", "Задача", "task"], ["calendar", "#ff9a5b", "Событие", "ev"], ["note", "#c78bff", "Заметка", "note"]].map(([i, c, l, a]) => `<button class="act" data-act="${a}">${tint(i, c, 42)}${l}</button>`).join("")}</div>`,
      qa: () => `<div class="qa"><input id="qa" placeholder="Завтра в 16:00 отчёт…"><button class="ibtn soft" id="qaT" aria-label="Добавить задачу">${ic("tasks", 19)}</button><button class="ibtn acc" id="qaR" aria-label="Добавить напоминание">${ic("bell", 19)}</button></div>`,
      rem: () => sec("Ближайшие напоминания", "reminders") + (next.length ? next.map(remRow).join("") : empty("Нет ближайших напоминаний")),
      tasks: () => sec("Задачи на сегодня", "tasks") + (todayTasks.length ? todayTasks.slice(0, 5).map(taskRow).join("") : empty("На сегодня всё сделано")),
      water: () => `<h2>Вода</h2><div class="card"><div class="water-w">${tint("drop", "#4aa8ff", 44)}<div class="grow"><div class="title">${wl} из ${wg} мл</div><div class="bar"><i style="width:${wp}%"></i></div></div><button class="btn sm sec" data-w="250">+250</button></div></div>`,
      strip: () => sec("Неделя вперёд", "cal", "Календарь") + `<div class="strip">${strip.map(s => `<div class="day ${s.key === k ? "today" : ""}" data-k="${s.key}"><span>${DAYS[s.d.getDay()]}</span><b>${s.d.getDate()}</b><em>${Array.from({ length: Math.min(3, s.n) }, () => "<i></i>").join("")}</em></div>`).join("")}</div>`,
      habits: () => S.habits.length ? sec("Привычки", "habits") + S.habits.map(hb => { const st = habitStreak(hb); return `<div class="card li" data-hid="${hb.id}"><div class="chk ${hb.log[k] ? "done" : ""}" data-hchk></div><div class="grow"><div class="title">${esc(hb.name)}</div><div class="meta">${hb.goal.type === "week" ? hb.goal.n + " раза в неделю" : "каждый день"}</div></div>${st.n ? `<span class="streak">${ic("flame", 15)}${st.n}</span>` : ""}</div>`; }).join("") : "",
      fin: () => { const m = monthTx(now.getFullYear(), now.getMonth()), inc = m.filter(t => t.type === "in").reduce((a, t) => a + t.amt, 0), exp = m.filter(t => t.type !== "in").reduce((a, t) => a + t.amt, 0), last = S.tx.slice().sort((a, b) => b.ts - a.ts).slice(0, 2);
        return sec("Финансы месяца", "fin", "Открыть") + `<div class="card"><div class="row"><div class="grow"><div class="meta">Баланс</div><div class="title" style="font-size:24px;font-weight:800;letter-spacing:-.03em">${money(inc - exp)}</div></div><div style="text-align:right"><b style="color:var(--ok)">+${money(inc)}</b><div></div><b style="color:var(--bad)">−${money(exp)}</b></div></div>${last.map(t => `<div class="row meta" style="margin-top:8px"><div class="grow">${esc(t.cat)}${t.note ? " · " + esc(t.note) : ""}</div><b>${t.type === "in" ? "+" : "−"}${money(t.amt)}</b></div>`).join("")}</div>`; },
      notes: () => { const l = S.notes.slice().sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (b.ts || 0) - (a.ts || 0)).slice(0, 3);

function resizeImg(file, cb) {

}
function noteForm(id, type0) {
  const n = id ? S.notes.find(x => x.id === id) : null;

    <img id="f_pv" class="thumb ${img ? "" : "hidden"}" src="${img || ""}" alt="">

    <div class="grid2" style="margin-top:8px"><button class="btn" id="f_ok">Сохранить</button>${n ? '<button class="btn bad" id="f_del">Удалить</button>' : "<span></span>"}</div>`,

      $("#f_img").onchange = e => { const f = e.target.files[0]; if (f) resizeImg(f, d => { img = d; $("#f_pv").src = d; $("#f_pv").classList.remove("hidden"); $("#f_ri").classList.remove("hidden"); }); };

        else { const old = Object.fromEntries((v.items || []).map(i => [i.t, i.done])); o.items = b.split("\n").map(s => s.trim()).filter(Boolean).map(t => ({ t, done: !!old[t] })); o.text = ""; }
        if (n) Object.assign(n, o); else S.notes.push({ id: uid(), ts: Date.now(), ...o });
        after();

    });
}

SCREENS.fin = function (v) {

    <h2>Расходы по категориям</h2>

    $("#swRs").onclick = () => { S.sw = { running: false, start: 0, acc: 0, laps: [] }; save(false); render(); };
  } else {
    const p = S.pomo, today = S.pomoLog.filter(ts => dkey(new Date(ts)) === todayKey()).length;
    tb.innerHTML = `<div class="card"><div class="meta" style="text-align:center">${p.mode === "work" ? "Фокус" : "Перерыв"} · сегодня сессий: ${today}</div><div class="big" id="pmClk">${fmtDur(pomoLeft())}</div>
      <div class="row" style="justify-content:center"><button class="btn" id="pmGo">${p.running ? "Пауза" : "Старт"}</button><button class="btn sec" id="pmSkip">Пропустить</button><button class="btn bad" id="pmRs">Сброс</button></div></div>
      <div class="card"><div class="grid2"><div><label>Фокус, мин</label><input id="pmW" type="number" min="1" value="${S.settings.pomo.work}"></div><div><label>Перерыв, мин</label><input id="pmB" type="number" min="1" value="${S.settings.pomo.brk}"></div></div></div>`;
    const setLeft = () => { S.pomo.left = (S.pomo.mode === "work" ? S.settings.pomo.work : S.settings.pomo.brk) * 60; };
    $("#pmGo").onclick = () => { if (p.running) { p.left = pomoLeft(); p.running = false; } else { p.end = Date.now() + pomoLeft() * 1000; p.running = true; } save(false); render(); };
    $("#pmSkip").onclick = () => { p.mode = p.mode === "work" ? "brk" : "work"; p.running = false; setLeft(); save(false); render(); };
    $("#pmRs").onclick = () => { p.running = false; setLeft(); save(false); render(); };
    const chg = () => { S.settings.pomo.work = Math.max(1, +val("pmW") || 25); S.settings.pomo.brk = Math.max(1, +val("pmB") || 5); if (!p.running) setLeft(); save(false); };
    $("#pmW").onchange = chg; $("#pmB").onchange = chg;

};
function toolsTick(force) {
  if (R.screen !== "tools") return;
  if (TT === "timers") {
    const el = $("#tList"); if (!el) return;
    if (!S.timers.length) { el.innerHTML = '<div class="empty">Нет таймеров</div>'; return; }
    const sig = S.timers.map(t => t.id + t.running).join();
    if (force || el.dataset.sig !== sig) {
      el.dataset.sig = sig;
      el.innerHTML = S.timers.map(t => `<div class="card" data-tid="${t.id}"><div class="row"><div class="grow title">${esc(t.name)}</div><span class="meta">${fmtDur(t.total)}</span></div><div class="big" data-clock></div><div class="bar"><i data-bar></i></div>
        <div class="row" style="margin-top:10px;justify-content:center"><button class="btn sm" data-ta="toggle">${t.running ? "Пауза" : (t.left <= 0 ? "Заново" : "Старт")}</button><button class="btn sec sm" data-ta="reset">Сброс</button><button class="btn bad sm" data-ta="del">Удалить</button></div></div>`).join("");
      $$("[data-ta]", el).forEach(b => b.onclick = () => {
        const id = b.closest("[data-tid]").dataset.tid, i = S.timers.findIndex(x => x.id === id), t = S.timers[i];
        if (b.dataset.ta === "del") S.timers.splice(i, 1);
        else if (b.dataset.ta === "reset") { t.running = false; t.left = t.total; }
        else if (t.running) { t.left = tLeft(t); t.running = false; }
        else { if (t.left <= 0) t.left = t.total; t.end = Date.now() + t.left * 1000; t.running = true; }
        save(false); toolsTick(true);
      });
    }
    $$("[data-tid]", el).forEach(c => { const t = S.timers.find(x => x.id === c.dataset.tid); if (!t) return; c.querySelector("[data-clock]").textContent = fmtDur(tLeft(t)); c.querySelector("[data-bar]").style.width = (t.total ? (1 - tLeft(t) / t.total) * 100 : 100) + "%"; });
  } else if (TT === "sw") { const c = $("#swClk"); if (c) c.textContent = fmtSw(swMs()); }
  else { const c = $("#pmClk"); if (c) c.textContent = fmtDur(pomoLeft()); }
}
