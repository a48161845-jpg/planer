/* ============ сейф (шифрование пароля в браузере, AES-GCM) ============ */
let VK = null, VITEMS = [];
async function vKey(pass, salt) { const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); }
async function vSave() { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, VK, new TextEncoder().encode(JSON.stringify(VITEMS))); S.vault.iv = b64u(iv); S.vault.d = b64u(new Uint8Array(ct)); save(false); }
SCREENS.vault = function (v) {
  if (!window.crypto || !crypto.subtle) { v.innerHTML = '<div class="empty">Шифрование недоступно: нужен защищённый адрес (https)</div>'; return; }
  if (!S.vault) {
    v.innerHTML = `<div class="card"><div class="title">Создайте сейф</div><div class="meta" style="margin:4px 0 10px">Записи шифруются паролем прямо на устройстве. Если пароль забыть, восстановить записи нельзя.</div>
      <input id="vp1" type="password" placeholder="Пароль (от 6 символов)"><input id="vp2" type="password" placeholder="Повторите пароль"><button class="btn full" id="vMk">Создать</button></div>`;
    $("#vMk").onclick = async () => {
      const a = val("vp1"); if (a.length < 6) return toast("Пароль слишком короткий"); if (a !== val("vp2")) return toast("Пароли не совпадают");
      const salt = crypto.getRandomValues(new Uint8Array(16)); S.vault = { salt: b64u(salt), iv: "", d: "" }; VK = await vKey(a, salt); VITEMS = []; await vSave(); render();
    };
  } else if (!VK) {
    v.innerHTML = `<div class="card"><div class="title">Сейф заблокирован</div><input id="vp" type="password" placeholder="Пароль" style="margin-top:10px"><button class="btn full" id="vOpen">Открыть</button></div>`;
    $("#vOpen").onclick = async () => {
      try { const k = await vKey(val("vp"), unb64u(S.vault.salt)); const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64u(S.vault.iv) }, k, unb64u(S.vault.d)); VITEMS = JSON.parse(new TextDecoder().decode(pt)); VK = k; render(); }
      catch (e) { toast("Неверный пароль"); }
    };
  } else {
    v.innerHTML = `<div class="grid2" style="margin-bottom:10px"><button class="btn" id="vAdd">+ Запись</button><button class="btn sec" id="vLock">Закрыть сейф</button></div>
      ${VITEMS.length ? VITEMS.map((x, i) => `<div class="card" data-i="${i}"><div class="row"><div class="grow title">🔐 ${esc(x.t)}</div><button class="btn sec sm" data-a="cp">Копировать</button><button class="btn bad sm" data-a="del">${ic("x", 14)}</button></div><div class="pre meta" data-sec>••••••••</div><button class="btn sec sm" data-a="show" style="margin-top:6px">Показать</button></div>`).join("") : '<div class="empty">Записей нет</div>'}`;
    $("#vLock").onclick = () => { VK = null; VITEMS = []; render(); };
    $("#vAdd").onclick = () => prompt2("Новая запись", [{ id: "t", l: "Название" }, { id: "x", l: "Содержимое" }], r => { if (!r.t.trim()) return false; VITEMS.push({ t: r.t.trim(), x: r.x }); vSave(); });
    $$("[data-a]", v).forEach(b => b.onclick = async () => {
      const card = b.closest("[data-i]"), i = +card.dataset.i, a = b.dataset.a;
      if (a === "show") { const s = $("[data-sec]", card); const h = s.dataset.on === "1"; s.dataset.on = h ? "0" : "1"; s.textContent = h ? "••••••••" : VITEMS[i].x; b.textContent = h ? "Показать" : "Скрыть"; }
      else if (a === "cp") { try { await navigator.clipboard.writeText(VITEMS[i].x); toast("Скопировано"); } catch (e) { toast("Не удалось скопировать"); } }
      else if (confirm("Удалить запись?")) { VITEMS.splice(i, 1); await vSave(); render(); }
    });
  }
};

function setAccount(acc) { S.account = acc; save(false); }
function finishAuth(acc) {
  setAccount(acc);
  const a = $("#auth"); a.classList.add("hidden"); a.innerHTML = "";
  render();
}
function logout() {
  if (!confirm("Выйти? Данные на этом устройстве останутся, но синхронизация остановится.")) return;
  S.account = null; save(false); showAuth();
}
const ID_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function genId() { const r = new Uint8Array(6); crypto.getRandomValues(r); return "PL-" + [...r].map(x => ID_ABC[x % ID_ABC.length]).join(""); }
function ensureId() { if (!S.appId) { S.appId = genId(); save(false); } return S.appId; }
function regCommand() { return `/reg ${ensureId()} ${-new Date().getTimezoneOffset()} ${deviceZone()}`.trim(); }
function openBot() {
  if (!CFG.BOT) return toast("Укажите имя бота в config.js");
  const url = "https://t.me/" + CFG.BOT.replace(/^@/, "");
  if (inTG && TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url, "_blank");
}
function parseToken(t) {
  try {
    t = (t || "").trim().replace(/^`+|`+$/g, "");
    if (!t.startsWith("K1.")) return null;
    const o = JSON.parse(new TextDecoder().decode(unb64u(t.slice(3))));
    return o && o.a === S.appId && o.u ? o : null;
  } catch (e) { return null; }
}
function showAuth() {
  ensureId();
  const a = $("#auth"); a.classList.remove("hidden");
  a.innerHTML = `<div class="auth-box"><div class="auth-logo">${ic("calendar", 34)}${avatar()}</div><h1>Планер</h1><p>Регистрация идёт только текстом в чате с ботом — никаких переходов на сайты.</p>
    <div class="idcard"><span>Ваш ID в приложении</span><b>${S.appId}</b></div>
    <ol class="steps"><li>Нажмите «Скопировать команду».</li><li>Вставьте её в чат с ботом и отправьте. Бот запомнит ваш ID.</li><li>Бот ответит кодом — вставьте его ниже.</li></ol>
    <div class="grid2"><button class="btn" id="aCopy">Скопировать команду</button><button class="btn sec" id="aBot">${ic("send", 18)} Открыть бота</button></div>
    <input id="aTok" placeholder="Код от бота (K1.…)" autocomplete="off" style="margin-top:12px">
    <button class="btn full big" id="aGo" style="margin-top:8px">Подтвердить</button>
    <button class="auth-skip" id="aSkip">Продолжить без входа</button>
    <div class="auth-hint" style="margin-top:2px">Без входа синхронизации не будет: данные останутся только на этом устройстве, резервная копия и выгрузка данных недоступны.</div></div>`;
  $("#aCopy").onclick = async () => toast((await copyText(regCommand())) ? "Команда скопирована — вставьте в чат с ботом" : regCommand());
  $("#aBot").onclick = openBot;
  $("#aGo").onclick = () => { const o = parseToken($("#aTok").value); if (!o) return toast("Код не подходит: проверьте, что копируете ответ бота для этого ID"); finishAuth({ mode: "tg", via: "id", tgId: o.u, name: o.n || "" }); toast("Вход выполнен"); };
  $("#aSkip").onclick = () => { if (confirm("Продолжить без входа? Синхронизации по аккаунту не будет, резервную копию и выгрузку данных сделать нельзя.")) finishAuth({ mode: "local" }); };
}

</script>
<script>
"use strict";
/* ============ настройка внешнего вида: нижнее меню и главный экран ============ */
const swap = (arr, i, j) => { if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
const arrow = (cls, i, rot, label) => `<button class="ibtn sm" data-${cls}="${i}" aria-label="${label}"><span style="display:flex;transform:rotate(${rot}deg)">${ic("back", 16)}</span></button>`;

function homeLayoutSheet() {
  const ws = S.settings.widgets;
  const draw = () => sheet("Главный экран", `<div class="meta" style="margin:0 4px 10px">Включайте нужные блоки и меняйте их порядок стрелками.</div>
    <div class="group">${ws.map((w, i) => `<div class="card li" data-i="${i}"><div class="grow title" style="${w.on ? "" : "opacity:.5"}">${esc(WIDGET_DEF.find(d => d[0] === w.id)[1])}</div>${arrow("up", i, 90, "Выше")}${arrow("dn", i, -90, "Ниже")}<input type="checkbox" data-on="${i}" ${w.on ? "checked" : ""} aria-label="Показывать"></div>`).join("")}</div>
    <div class="grid2" style="margin-top:14px"><button class="btn sec" id="lyReset">Сбросить</button><button class="btn" id="lyOk">Готово</button></div>`, root => {
    $$("[data-up]", root).forEach(b => b.onclick = () => { const i = +b.dataset.up; swap(ws, i, i - 1); save(false); draw(); });
    $$("[data-dn]", root).forEach(b => b.onclick = () => { const i = +b.dataset.dn; swap(ws, i, i + 1); save(false); draw(); });
    $$("[data-on]", root).forEach(c => c.onchange = () => { ws[+c.dataset.on].on = c.checked; save(false); draw(); });
    $("#lyReset").onclick = () => { S.settings.widgets = WIDGET_DEF.map(d => ({ id: d[0], on: d[2] })); save(false); closeSheet(); render(); };
    $("#lyOk").onclick = () => { closeSheet(); render(); };
  });
  draw();
}

function navLayoutSheet() {
  const nav = S.settings.nav, MAX = 5;
  const draw = () => {
    const rest = Object.keys(NAV_META).filter(id => !nav.includes(id));
    sheet("Нижнее меню", `<div class="meta" style="margin:0 4px 10px">До ${MAX} разделов плюс «Ещё». Остальные разделы доступны через «Ещё» и главный экран.</div>
      <div class="group">${nav.map((id, i) => `<div class="card li">${tint(NAV_META[id][1], "var(--accent)", 36)}<div class="grow title">${NAV_META[id][0]}</div>${arrow("up", i, 90, "Выше")}${arrow("dn", i, -90, "Ниже")}<button class="ibtn sm" data-rm="${i}" aria-label="Убрать" ${nav.length <= 2 ? "disabled" : ""}>${ic("x", 15)}</button></div>`).join("")}</div>
      <h2>Добавить${nav.length >= MAX ? ` <span style="font-weight:400">— меню заполнено</span>` : ""}</h2>
      <div class="chips">${rest.map(id => `<span class="chip" data-add="${id}" style="${nav.length >= MAX ? "opacity:.4" : ""}">${NAV_META[id][0]}</span>`).join("")}</div>
      <div class="grid2" style="margin-top:14px"><button class="btn sec" id="lyReset">Сбросить</button><button class="btn" id="lyOk">Готово</button></div>`, root => {
      $$("[data-up]", root).forEach(b => b.onclick = () => { const i = +b.dataset.up; swap(nav, i, i - 1); save(false); draw(); });
      $$("[data-dn]", root).forEach(b => b.onclick = () => { const i = +b.dataset.dn; swap(nav, i, i + 1); save(false); draw(); });
      $$("[data-rm]", root).forEach(b => b.onclick = () => { if (nav.length > 2) { nav.splice(+b.dataset.rm, 1); save(false); draw(); } });
      $$("[data-add]", root).forEach(c => c.onclick = () => { if (nav.length >= MAX) return toast("Максимум " + MAX + " разделов"); nav.push(c.dataset.add); save(false); draw(); });
      $("#lyReset").onclick = () => { S.settings.nav = def().settings.nav; save(false); closeSheet(); render(); };
      $("#lyOk").onclick = () => { closeSheet(); render(); };
    });
  };
  draw();
}

</script>
<script>
"use strict";
/* ============ поиск по всему приложению ============ */
SCR_TITLES.search = "Поиск";
SCREENS.search = function (v) {
  v.innerHTML = `<div class="qa searchbar">${ic("search", 19)}<input id="sq" placeholder="Задачи, напоминания, заметки, события…" autocomplete="off"></div><div id="sres"></div>`;
  const out = $("#sres", v), inp = $("#sq", v);
  const hit = (...f) => { const q = inp.value.trim().toLowerCase(); return q && f.some(x => String(x || "").toLowerCase().includes(q)); };
  const row = (icn, color, title, meta, attrs) => `<div class="card li clk" ${attrs}>${tint(icn, color, 36)}<div class="grow"><div class="title">${esc(title)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ""}</div><span class="chev">${ic("chevron", 18)}</span></div>`;
  const draw = () => {
    if (!inp.value.trim()) { out.innerHTML = empty("Начните вводить: ищем по задачам, напоминаниям, событиям, заметкам и целям"); return; }
    const g = [];
    const T = S.tasks.filter(t => hit(t.title, t.project, (t.subs || []).map(x => x.t).join(" "))).slice(0, 8);
    const Rm = S.reminders.filter(r => hit(r.title)).slice(0, 8);
    const E = S.events.filter(e => hit(e.title, e.place)).slice(0, 8);
    const N = S.notes.filter(n => hit(n.title, n.text, n.tags, (n.items || []).map(x => x.t).join(" "))).slice(0, 8);
    const G = S.goals.filter(x => hit(x.name)).slice(0, 5);
    if (T.length) g.push(`<h2>Задачи</h2>${T.map(t => row("tasks", "#4fd18f", t.title, (t.due ? fmtDate(t.due) : "без срока") + (t.done ? " · выполнена" : ""), `data-s="t:${t.id}"`)).join("")}`);
    if (Rm.length) g.push(`<h2>Напоминания</h2>${Rm.map(r => row("bell", "#6a8cff", r.title, fmtDT(r.at), `data-s="r:${r.id}"`)).join("")}`);
    if (E.length) g.push(`<h2>События</h2>${E.map(e => row("calendar", "#ff9a5b", e.title, e.date ? fmtDate(e.date) : "", `data-s="e:${e.id}"`)).join("")}`);
    if (N.length) g.push(`<h2>Заметки</h2>${N.map(n => row("note", "#c78bff", n.title || "Без названия", "", `data-s="n:${n.id}"`)).join("")}`);
    if (G.length) g.push(`<h2>Цели</h2>${G.map(x => row("target", "#e0725f", x.name, "", `data-s="g:0"`)).join("")}`);
    out.innerHTML = g.length ? g.join("") : empty("Ничего не найдено");
    $$("[data-s]", out).forEach(c => c.onclick = () => { const [k, id] = c.dataset.s.split(":"); ({ t: () => taskForm(id), r: () => remForm(id), e: () => eventForm(id), n: () => noteForm(id), g: () => go("more", "goals") })[k](); });
  };
  inp.oninput = draw; draw(); setTimeout(() => inp.focus(), 50);
};

/* ============ уведомления в Android-приложении (APK): работают при закрытом приложении ============ */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const LN = () => NATIVE && window.Capacitor.Plugins && Capacitor.Plugins.LocalNotifications;
const nid = str => { let h = 7; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h) % 2147483000 + 1; };
let nativeT = 0, nativeBusy = false;
function nativeSchedule() {
  if (!NATIVE) return;
  clearTimeout(nativeT); nativeT = setTimeout(doNativeSchedule, 1500);
}
async function doNativeSchedule() {
  const ln = LN(); if (!ln || nativeBusy) return;
  nativeBusy = true;
  try {
    const perm = await ln.checkPermissions();
    if (perm.display !== "granted") { const r = await ln.requestPermissions(); if (r.display !== "granted") return; }
    const pend = await ln.getPending();
    if (pend.notifications && pend.notifications.length) await ln.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
    const now = Date.now(), list = [], push = (key, title, body, at) => { if (at > now + 3000 && list.length < 60) list.push({ id: nid(key), title, body: body || "", schedule: { at: new Date(at), allowWhileIdle: true }, channelId: "planner" }); };
    for (const r of S.reminders) {
      if (r.done) continue;
      let at = r.at, n = 0;
      while (n < (r.repeat !== "none" ? 6 : 1) && list.length < 60) {
        for (const m of (r.pre && r.pre.length ? r.pre : [0])) push(r.id + ":" + at + ":" + m, m ? "Скоро: " + r.title : "Напоминание", m ? "через " + (m >= 1440 ? "1 день" : m >= 60 ? m / 60 + " ч" : m + " мин") : r.title, at - m * 60000);
        if (r.repeat === "none") break;
        at = nextRepeat(at, r.repeat, r.days); n++;
      }
    }
    for (let d = 0; d < 7; d++) {
      const key = dkey(addDays(new Date(), d));
      for (const it of itemsOn(key)) if ((it.src === "ev" || it.src === "sch") && it.time) { const [h, m] = it.time.split(":").map(Number), dt = pkey(key); dt.setHours(h, m, 0, 0); push("e:" + it.ref + key, "Скоро: " + it.title, "в " + it.time + (it.place ? ", " + it.place : ""), dt.getTime() - 10 * 60000); }
    }
    for (const t of S.timers) if (t.running && t.end > now) push("tm:" + t.id + t.end, "Таймер", t.name, t.end);
    if (list.length) await ln.schedule({ notifications: list });
  } catch (e) { /* уведомления недоступны — приложение продолжит работать */ }
  nativeBusy = false;
}
if (NATIVE) {
  document.addEventListener("DOMContentLoaded", () => { const ln = LN(); if (ln && ln.createChannel) ln.createChannel({ id: "planner", name: "Напоминания", importance: 5, vibration: true }).catch(() => { }); nativeSchedule(); });
  setTimeout(nativeSchedule, 2500);
}

</script>
<script>
"use strict";
/* ============ фоновая проверка: напоминания, таймеры, события, привычки ============ */
let hiddenAt = 0;
function tick() {
  const now = Date.now(), nd = new Date(), today = todayKey(), nowMin = nd.getHours() * 60 + nd.getMinutes();
  let ch = false;
  const once = key => { if (S.sent[key]) return false; S.sent[key] = today; ch = true; return true; };

  for (const r of S.reminders) {
    if (r.done) continue;
    r.fk = r.fk || [];
    const pres = r.pre && r.pre.length ? r.pre : [0];
    for (const m of pres) {
      const key = r.at + ":" + m;
      if (r.fk.includes(key) || now < r.at - m * 60000) continue;
      r.fk.push(key); ch = true;
      if (m > 0 && now >= r.at) continue; // заблаговременное уже неактуально
      if (m > 0) notify("Скоро: " + r.title, "через " + (m >= 1440 ? "1 день" : m >= 60 ? (m / 60) + " ч" : m + " мин"));
      else notify("Напоминание", r.title);
    }
    if (now >= r.at && pres.every(m => r.fk.includes(r.at + ":" + m)) && r.repeat !== "none") {
      r.at = nextRepeat(r.at, r.repeat, r.days); r.fk = []; ch = true;
    }
  }
  for (const t of S.timers) if (t.running && now >= t.end) { t.running = false; t.left = 0; ch = true; notify("Таймер", t.name); }
  const p = S.pomo;
  if (p.running && now >= p.end) {
    p.running = false; ch = true;
    if (p.mode === "work") { S.pomoLog.push(now); notify("Pomodoro", "Фокус завершён — время перерыва"); p.mode = "brk"; }
    else { notify("Pomodoro", "Перерыв окончен"); p.mode = "work"; }
    p.left = (p.mode === "work" ? S.settings.pomo.work : S.settings.pomo.brk) * 60;
  }
  for (const it of itemsOn(today)) {
    if ((it.src === "ev" || it.src === "sch") && it.time) {
      const sm = hm(it.time);
      if (nowMin >= sm - 10 && nowMin < sm && once("e:" + it.ref + ":" + today)) notify("Скоро: " + it.title.replace(/^🎂 /, ""), `в ${it.time}${it.place ? ", " + it.place : ""}`);
    }
    if (it.k === "birthday" && nowMin >= 540 && once("b:" + it.ref + ":" + today)) notify("День рождения", it.title.replace(/^🎂 /, ""));
  }
  for (const h of S.habits) {
    if (h.remind && !h.log[today] && nowMin >= hm(h.remind) && nowMin < hm(h.remind) + 120 && once("h:" + h.id + ":" + today)) notify("Привычка", (iconText(h.icon) + " " + h.name).trim());
  }
  const keys = Object.keys(S.sent);
  if (keys.length > 200) { const lim = dkey(addDays(nd, -3)); keys.forEach(k => { if (S.sent[k] < lim) delete S.sent[k]; }); ch = true; }

  if (ch) { save(); if (!/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "")) render(); }
  const clk = $("#clk"); if (clk) clk.textContent = `${pad(nd.getHours())}:${pad(nd.getMinutes())}`;
}

/* ============ блокировка PIN ============ */
function lockApp() {
  const pin = S.settings.pin; if (!pin) return;
  const l = $("#lock"); l.classList.remove("hidden");
  l.innerHTML = '<div class="box"><div style="font-size:42px">🔒</div><h2 style="justify-content:center">Планер</h2><input id="lk" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="btn full" id="lkOk">Открыть</button></div>';
  const tryPin = async () => {
    const h = await sha(pin.salt + $("#lk").value);
    if (h === pin.h) { l.classList.add("hidden"); l.innerHTML = ""; } else { toast("Неверный PIN"); $("#lk").value = ""; }
  };
  $("#lkOk").onclick = tryPin; $("#lk").onkeydown = e => { if (e.key === "Enter") tryPin(); };
  setTimeout(() => { const i = $("#lk"); if (i) i.focus(); }, 60);
}
$("#hLock").onclick = lockApp;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else { cloudSyncStart(); if (S.settings.pin && hiddenAt && Date.now() - hiddenAt > 60000) lockApp(); tick(); if (!/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "")) render(); }
});

/* ============ регистрация: часовой пояс определяется автоматически ============ */
function startRegistration() {
  REG_MODE = true;
  const zone = deviceZone(), off = -new Date().getTimezoneOffset(), a = Math.abs(off);
  const label = `${zone ? zone + ", " : ""}UTC${off >= 0 ? "+" : "−"}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
  sheet("Регистрация", `<div class="card"><div class="title">Почти готово</div><div class="meta" style="margin:6px 0">Часовой пояс определён автоматически: ${esc(label)}. Данные отправляются боту, окно закроется само.</div></div>
    <button class="btn full" id="regGo">Завершить регистрацию</button>`, w => { $("#regGo").onclick = sendToBot; });
  setTimeout(sendToBot, 1200);
}

/* ============ запуск ============ */
(function init() {
  applyTheme(); ensureId();
  if (S.settings.pin) lockApp();
  if (inTG && !(S.account && S.account.mode === "tg")) { S.account = { mode: "tg", name: (TG.initDataUnsafe.user || {}).first_name || "" }; save(false); }
  if (!S.account) showAuth();
  if (inTG) { $("#tgDot").classList.add("on"); $("#tgState").textContent = (TG.initDataUnsafe.user || {}).first_name || "Telegram"; }
  const q = new URLSearchParams(location.search);
  const scr = q.get("screen"), tab = q.get("tab");
  if (scr && SCREENS[scr]) R = { tab: "more", screen: scr, arg: null };
  else if (tab && NAV_META[tab] && TABVIEWS[tab]) R = { tab, screen: null, arg: null };
  handleInbound().then(() => { render(); tick(); if (inTG && q.get("reg") === "1") startRegistration(); else cloudSyncStart(); });
  setInterval(tick, 1000);
  setInterval(() => toolsTick(false), 100);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
})();

</script>
