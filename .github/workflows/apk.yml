name: Build Android APK

# Запуск вручную: вкладка Actions -> Build Android APK -> Run workflow.
# Готовый файл появится в разделе Releases репозитория (и в Artifacts запуска).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          pip install --quiet pillow
          python tools/make_icons.py
          mkdir -p build/app/www
          cp -r web/. build/app/www/
          # в APK приложение работает автономно: скрипт Telegram и service worker не нужны
          sed -i '/telegram-web-app.js/d' build/app/www/index.html
          rm -f build/app/www/sw.js
          sed -i 's#navigator.serviceWorker.register("sw.js").catch(() => { })#void 0#' build/app/www/js/boot.js
          grep -c "serviceWorker" build/app/www/js/boot.js || true

      - name: Create Android project (Capacitor)
        working-directory: build/app
        run: |
          npm init -y >/dev/null
          npm install --silent @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.planner.mobile",
            "appName": "Планер",
            "webDir": "www",
            "backgroundColor": "#0b0d1a",
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          npx cap sync android
          # значки приложения
          python ../../tools/make_icons.py android/app/src/main/res
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          # разрешения для точных уведомлений при закрытом приложении
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do
            grep -q "android.permission.$P" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" "$M"
          done
          grep -n "uses-permission" "$M"

      - name: Build APK
        working-directory: build/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../planner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: planner-apk
          path: build/planner.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" build/planner.apk \
            --title "Планер (Android) #${{ github.run_number }}" \
            --notes "Установочный файл planner.apk для Android. Разрешите установку из неизвестных источников."
